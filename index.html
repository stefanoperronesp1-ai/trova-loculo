<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trova Loculo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2E4A3C">
<meta name="description" content="Trova un loculo nel cimitero: cerca il nome e segui la freccia.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;700&display=swap">
<style>
/* Layout: una sola colonna da telefono (max 640px), barra in alto col nome del cimitero, schede in basso; il navigatore occupa lo schermo. */
:root{
  --bg:#ECECE7;          /* travertino */
  --surface:#F9F9F6;     /* marmo */
  --sunk:#E2E2DB;
  --ink:#1E2225;         /* ardesia */
  --muted:#5A6166;
  --line:#CFCFC7;
  --bronze:#80602F;      /* lettere in bronzo */
  --bronze-soft:#E9DFCB;
  --on-bronze:#FFFFFF;
  --cypress:#2E4A3C;     /* cipresso */
  --on-cypress:#F4F2EA;
  --ok:#2D6A43; --warn:#94570F; --bad:#A0352A;
  --map-bg:#F3F3EF; --map-dot:#8B9095;
  --font-display:'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131618;--surface:#1B1F22;--sunk:#24292D;--ink:#ECEBE5;--muted:#A2A9AD;--line:#30373C;
  --bronze:#CDA866;--bronze-soft:#3A3122;--on-bronze:#17130B;--cypress:#9CC2A9;--on-cypress:#10170F;
  --ok:#7CC796;--warn:#E3A55A;--bad:#F08C7E;--map-bg:#181C1F;--map-dot:#7C848A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131618;--surface:#1B1F22;--sunk:#24292D;--ink:#ECEBE5;--muted:#A2A9AD;--line:#30373C;
  --bronze:#CDA866;--bronze-soft:#3A3122;--on-bronze:#17130B;--cypress:#9CC2A9;--on-cypress:#10170F;
  --ok:#7CC796;--warn:#E3A55A;--bad:#F08C7E;--map-bg:#181C1F;--map-dot:#7C848A;color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cypress)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cypress);color:var(--on-cypress)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:56px}
.brand{font-family:var(--font-display);font-weight:700;letter-spacing:.08em;font-size:15px;white-space:nowrap}
.bar .where{min-width:0;flex:1;font-size:14px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.back{background:none;border:0;color:inherit;font-size:15px;padding:6px 4px;cursor:pointer;display:flex;align-items:center;gap:4px}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:18px;display:flex;flex-direction:column;gap:16px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;color:var(--muted);cursor:pointer}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="true"]{color:var(--bronze);font-weight:700}

h1,h2{margin:0;text-wrap:balance}
h1{font-size:22px;line-height:1.2}
h2{font-size:18px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:12px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-decoration:none;text-align:center}
.btn.primary{background:var(--bronze);border-color:var(--bronze);color:var(--on-bronze)}
.btn.dark{background:var(--cypress);border-color:var(--cypress);color:var(--on-cypress)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:20px;height:20px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.search{position:relative}
.search input{width:100%;font-size:19px;padding:14px 14px 14px 46px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface)}
.search input:focus{border-color:var(--bronze);outline:none}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted)}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.item:first-child{border-top:0}
.item:active{background:var(--sunk)}
.thumb{width:56px;height:56px;border-radius:6px;object-fit:cover;background:var(--sunk);display:block}
.item .t{min-width:0}
.item .name{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chev{color:var(--muted);width:18px;height:18px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.mute{color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}

/* Scheda */
.lapide{margin:0;border-radius:var(--r);overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.lapide img{display:block;width:100%;max-height:52vh;object-fit:contain;background:var(--sunk)}
.engraved{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.15;letter-spacing:.03em;text-wrap:balance}
.dates{font-family:var(--font-display);font-size:16px;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.posgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.posgrid div{background:var(--surface);padding:10px 12px}
.posgrid b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.posgrid span{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.coord{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* Navigatore */
.nav{display:flex;flex-direction:column;gap:12px}
.navhead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.navhead img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.navhead .engraved{font-size:19px}
.compass{position:relative;display:grid;place-items:center;padding:6px 0}
.dial{width:min(70vw,260px);aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--surface);border:1px solid var(--line);position:relative;display:grid;place-items:center}
.dial svg.arrow{width:62%;height:62%;transition:transform .25s ease-out;color:var(--bronze)}
.dial .north{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.dist{font-size:54px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.dist small{font-size:22px;font-weight:400;color:var(--muted)}
.navstatus{text-align:center;font-size:14.5px;color:var(--muted)}
.arrived{background:var(--cypress);color:var(--on-cypress);border-radius:var(--r);padding:14px 16px;font-weight:700;text-align:center}
.mapbox{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--map-bg)}
.mapbox canvas{display:block;width:100%;height:280px;touch-action:none}
.maplegend{position:absolute;left:8px;bottom:6px;font-size:11.5px;color:var(--muted)}

/* Form */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:700;color:var(--muted)}
label.f input,label.f select,label.f textarea{font-size:17px;font-weight:400;color:var(--ink);padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);width:100%;min-width:0}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--bronze);outline:none}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.progress{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--bronze);width:0;transition:width .2s}
.confirm{border:1px solid var(--bad);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}

.qrwrap{background:#fff;border-radius:var(--r);padding:12px;display:grid;place-items:center;border:1px solid var(--line)}
.qrwrap canvas{width:100%;max-width:360px;height:auto;display:block}
video.scan{width:100%;border-radius:var(--r);background:#000;aspect-ratio:3/4;object-fit:cover}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14.5px;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.guide h2{margin-top:6px}
.guide ol,.guide ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.guide p{max-width:65ch}
.kbd{font-weight:700;color:var(--bronze)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:grid;place-items:center;padding:16px}
.ov img{max-width:100%;max-height:100%;object-fit:contain}
@media (max-width:380px){.fgrid3{grid-template-columns:1fr 1fr}.dist{font-size:46px}}
@media (prefers-reduced-motion:reduce){.dial svg.arrow{transition:none}}
</style>

</head>
<body>
<header class="bar"><div class="wrap">
  <button class="back" id="btnBack" hidden aria-label="Indietro"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Indietro</button>
  <span class="brand" id="brand">TROVA LOCULO</span>
  <span class="where" id="where"></span>
</div></header>

<main><div class="wrap" id="view"></div></main>

<nav class="tabs" id="tabs" aria-label="Sezioni"><div class="wrap">
  <button data-tab="cerca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Cerca</button>
  <button data-tab="rilievo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Rilievo</button>
  <button data-tab="cimiteri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 21V9a5 5 0 0110 0v12M4 21h16M12 7v6M9.5 10h5"/></svg>Cimiteri</button>
  <button data-tab="guida"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.2M12 17h.01"/></svg>Guida</button>
</div></nav>
<div class="toast" id="toast" hidden role="status"></div>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// Licensed under the MIT license:

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      <input id="q" type="search" placeholder="Cognome e nome del defunto" autocomplete="off" autocapitalize="words" enterkeyhint="search" value="${esc(S.q)}" aria-label="Cerca il defunto">

/* ---------------------------------------------------------------- Mappa locale (proiezione piana sul baricentro) */
function makeMap(canvas, opts) {
  const ctx = canvas.getContext('2d');
  const st = { pts: [], target: null, me: null, heading: null, tap: null, view: null, onTap: opts.onTap };
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#888';
  function frame() {
    let pts = st.pts.filter(hasPos);
    if (pts.length > 2) {
      const med = a => { const b = [...a].sort((x, y) => x - y); return b[b.length >> 1]; };
      const m = { lat: med(pts.map(p => p.lat)), lon: med(pts.map(p => p.lon)) };
      pts = pts.filter(p => distM(p, m) < 1500);
    }
    const all = pts.concat(st.target && hasPos(st.target) ? [st.target] : []);
    if (st.me && (!all.length || distM(st.me, all[0]) < 600)) all.push(st.me);
    if (st.tap) all.push(st.tap);
    if (!all.length) return null;
    const lat0 = all.reduce((s, p) => s + p.lat, 0) / all.length, lon0 = all.reduce((s, p) => s + p.lon, 0) / all.length;
    const kx = Math.cos(rad(lat0)) * R_EARTH * Math.PI / 180, ky = R_EARTH * Math.PI / 180;
    const xy = p => ({ x: (p.lon - lon0) * kx, y: (p.lat - lat0) * ky });
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    all.forEach(p => { const q = xy(p); x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); });
    const span = Math.max(x1 - x0, y1 - y0, 30);
    return { lat0, lon0, kx, ky, xy, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, span };
  }
  function draw() {
    const dpr = window.devicePixelRatio || 1, W = canvas.clientWidth, H = canvas.clientHeight;
    if (!W) return;
    if (canvas.width !== Math.round(W * dpr)) { canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = css('--map-bg'); ctx.fillRect(0, 0, W, H);
    const f = frame(); st.view = f;
    if (!f) { ctx.fillStyle = css('--muted'); ctx.font = '14px ' + css('--font-body'); ctx.textAlign = 'center'; ctx.fillText('Nessun punto con coordinate', W / 2, H / 2); return; }
    const pad = 26, sc = Math.min(W - pad * 2, H - pad * 2) / f.span;
    f.sc = sc; f.W = W; f.H = H;
    const P = p => { const q = f.xy(p); return { x: W / 2 + (q.x - f.cx) * sc, y: H / 2 - (q.y - f.cy) * sc }; };
    f.P = P;
    // griglia 10 m
    const step = niceStep(f.span / 4);
    ctx.strokeStyle = css('--line'); ctx.lineWidth = 1;
    const gx0 = Math.floor((f.cx - W / 2 / sc) / step) * step, gy0 = Math.floor((f.cy - H / 2 / sc) / step) * step;
    for (let x = gx0; x < f.cx + W / 2 / sc; x += step) { const X = W / 2 + (x - f.cx) * sc; ctx.beginPath(); ctx.moveTo(X, 0); ctx.lineTo(X, H); ctx.stroke(); }
    for (let y = gy0; y < f.cy + H / 2 / sc; y += step) { const Y = H / 2 - (y - f.cy) * sc; ctx.beginPath(); ctx.moveTo(0, Y); ctx.lineTo(W, Y); ctx.stroke(); }
    // punti
    ctx.fillStyle = css('--map-dot');
    const seen = new Set();
    st.pts.forEach(p => {
      if (!hasPos(p) || (st.target && p.id === st.target.id)) return;
      const q = P(p), k = Math.round(q.x) + ':' + Math.round(q.y); if (seen.has(k)) return; seen.add(k);
      ctx.beginPath(); ctx.arc(q.x, q.y, 3.2, 0, 7); ctx.fill();
    });
    // posizione utente
    if (st.me) {
      const q = P(st.me);
      if (st.me.acc) { ctx.fillStyle = css('--cypress'); ctx.globalAlpha = .14; ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(6, st.me.acc * sc), 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
      if (st.heading != null) {
        const a = rad(st.heading - 90);
        ctx.fillStyle = css('--cypress'); ctx.globalAlpha = .35; ctx.beginPath(); ctx.moveTo(q.x, q.y);
        ctx.arc(q.x, q.y, 34, a - .45, a + .45); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
      }
      ctx.fillStyle = css('--cypress'); ctx.strokeStyle = css('--surface'); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(q.x, q.y, 7.5, 0, 7); ctx.fill(); ctx.stroke();
      if (st.target && hasPos(st.target)) {
        const t = P(st.target); ctx.setLineDash([5, 5]); ctx.strokeStyle = css('--bronze'); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(t.x, t.y); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    // obiettivo
    const tg = st.tap || (st.target && hasPos(st.target) ? st.target : null);
    if (tg) {
      const t = P(tg);
      ctx.fillStyle = css('--bronze'); ctx.strokeStyle = css('--surface'); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.arc(t.x, t.y - 18, 9, Math.PI * .75, Math.PI * .25); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = css('--surface'); ctx.beginPath(); ctx.arc(t.x, t.y - 18, 3.5, 0, 7); ctx.fill();
    }
    // nord e scala
    ctx.fillStyle = css('--muted'); ctx.font = '700 12px ' + css('--font-body'); ctx.textAlign = 'center';
    ctx.beginPath(); ctx.moveTo(W - 18, 10); ctx.lineTo(W - 24, 26); ctx.lineTo(W - 12, 26); ctx.closePath(); ctx.fill();
    ctx.fillText('N', W - 18, 40);
    const bar = step * sc; ctx.strokeStyle = css('--muted'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W - 12 - bar, H - 12); ctx.lineTo(W - 12, H - 12); ctx.moveTo(W - 12 - bar, H - 16); ctx.lineTo(W - 12 - bar, H - 8); ctx.moveTo(W - 12, H - 16); ctx.lineTo(W - 12, H - 8); ctx.stroke();
    ctx.font = '12px ' + css('--font-body'); ctx.fillText(step + ' m', W - 12 - bar / 2, H - 18);
  }
  function toLatLon(px, py) {
    const f = st.view; if (!f || !f.sc) return null;
    const x = (px - f.W / 2) / f.sc + f.cx, y = -(py - f.H / 2) / f.sc + f.cy;
    return { lat: f.lat0 + y / f.ky, lon: f.lon0 + x / f.kx };
  }
  canvas.addEventListener('click', e => {
    if (!st.onTap) return;
    const r = canvas.getBoundingClientRect(); const p = toLatLon(e.clientX - r.left, e.clientY - r.top);
    if (p) st.onTap(p);
  });
  const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(draw) : null; ro && ro.observe(canvas);
  return { st, draw, destroy() { ro && ro.disconnect(); } };
}
function niceStep(x) { const p = 10 ** Math.floor(Math.log10(Math.max(x, 1))); const n = x / p; return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p; }

/* ---------------------------------------------------------------- Navigatore */
function rNav() {
  const l = S.loculi.find(x => x.id === S.params.id);
  if (!l || !hasPos(l)) { back(); return; }
  view().innerHTML = `
    <div class="nav">
      <div class="navhead">${l.thumb ? `<img id="navph" src="${l.thumb}" alt="Lapide">` : '<span></span>'}
        <div><p class="engraved">${esc(nomeCompleto(l))}</p><p class="muted small">${esc(posTesto(l) || anni(l))}</p></div></div>
      <div id="arr" class="arrived" hidden></div>
      <div class="compass"><div class="dial"><span class="north" id="nlab">avanti</span><span id="arw" style="display:contents">${ICON.arrow}</span></div></div>
      <p class="dist" id="dist">—</p>
      <p class="navstatus" id="nst">Attendo il GPS…</p>
      <button class="btn dark block" id="btnCompass" hidden>Attiva la bussola</button>
      <div class="mapbox"><canvas id="map" aria-label="Mappa del cimitero"></canvas><span class="maplegend" id="mleg">Punti grigi: altre sepolture</span></div>
    </div>`;
  const map = makeMap($('#map'), { onTap: null });
  map.st.pts = S.loculi; map.st.target = l;
  const N = { pos: null, head: null, sim: false, sx: 0, sy: 0, buzzed: false };
  let alive = true, watch = null;

  function update() {
    if (!alive) return;
    map.st.me = N.pos; map.st.heading = N.head; map.draw();
    const arrow = $('#arw svg');
    if (!N.pos) return;
    const d = distM(N.pos, l), b = bearing(N.pos, l);
    const rel = N.head != null ? b - N.head : b;
    arrow.style.transform = `rotate(${rel}deg)`;
    $('#nlab').textContent = N.head != null ? 'avanti' : 'N';
    $('#dist').innerHTML = d < 1000 ? `${fmt(d)}<small> m</small>` : `${fmt(d / 1000, 1)}<small> km</small>`;
    const acc = N.pos.acc;
    const near = d <= Math.max(5, Math.min(acc || 5, 12));
    $('#nst').textContent = N.sim ? 'Modalità prova: tocca la mappa per spostarti.'
      : `Direzione ${cardinal(b)} · GPS ± ${fmt(acc || 0)} m${N.head == null ? ' · bussola non attiva: la freccia indica il nord in alto' : ''}`;
    const arr = $('#arr');
    if (near) {
      arr.hidden = false;
      arr.textContent = `Sei vicino. Cerca la lapide della foto${l.fila ? ': fila ' + l.fila + ' dal basso' : ''}${l.numero ? ', numero ' + l.numero : ''}.`;
      if (!N.buzzed) { N.buzzed = true; try { navigator.vibrate && navigator.vibrate([120, 80, 120]); } catch (e) { } }
    } else arr.hidden = true;
  }
  function tick() { if (!alive) return; update(); setTimeout(tick, 250); }

  // GPS
  const startSim = msg => {
    if (N.sim) return;
    N.sim = true;
    const start = { lat: l.lat - 40 / 111195, lon: l.lon - 25 / (111195 * Math.cos(rad(l.lat))) };
    N.pos = { ...start, acc: 4 };
    map.st.onTap = p => { N.pos = { lat: p.lat, lon: p.lon, acc: 4 }; N.buzzed = false; update(); };
    $('#mleg').textContent = 'Modalità prova: tocca un punto della mappa';
    toast(msg || 'GPS non disponibile qui: modalità prova attiva.', 3500);
  };
  if (navigator.geolocation) {
    try {
      watch = navigator.geolocation.watchPosition(p => {
        if (N.sim) return;
        N.pos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
      }, e => { if (!N.pos) startSim(e.code === 1 ? 'Posizione non consentita: modalità prova attiva.' : null); },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
    } catch (e) { startSim(); }
  } else startSim();

  // Bussola
  let hs = null, hc = null;
  const onOri = e => {
    let h = null;
    if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) h = e.webkitCompassHeading;
    else if ((e.absolute || e.type === 'deviceorientationabsolute') && e.alpha != null) h = 360 - e.alpha;
    if (h == null) return;
    const so = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    h = (h + so + 360) % 360;
    const s = Math.sin(rad(h)), c = Math.cos(rad(h));
    hs = hs == null ? s : hs * .8 + s * .2; hc = hc == null ? c : hc * .8 + c * .2;
    N.head = (deg(Math.atan2(hs, hc)) + 360) % 360;
  };
  const listen = () => {
    window.addEventListener('deviceorientationabsolute', onOri, true);
    window.addEventListener('deviceorientation', onOri, true);
  };
  listen();
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    const b = $('#btnCompass');
    setTimeout(() => { if (alive && N.head == null) b.hidden = false; }, 2000);
    b.onclick = async () => { try { if (await DeviceOrientationEvent.requestPermission() === 'granted') b.hidden = true; } catch (e) { toast('Bussola non consentita.'); } };
  } else listen();

  // Schermo acceso
  let lock = null;
  (async () => { try { lock = await navigator.wakeLock?.request('screen'); } catch (e) { } })();

  if (l.thumb && $('#navph')) $('#navph').addEventListener('click', async () => zoom(await DB.foto(l.id) || l.thumb));
  tick();
  cleanup.push(() => {
    alive = false;
    if (watch != null) navigator.geolocation.clearWatch(watch);
    window.removeEventListener('deviceorientationabsolute', onOri, true);
    window.removeEventListener('deviceorientation', onOri, true);
    try { lock && lock.release(); } catch (e) { }
    map.destroy();
  });
}

async function importa(files) {
  files = files.filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic)$/i.test(f.name));
  if (!files.length) { toast('Nessuna immagine tra i file scelti.'); return; }
  const box = $('#imp'), bar = $('#impbar'), txt = $('#imptxt');
  box.hidden = false;
  let conGps = 0, err = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    txt.textContent = `Importo ${i + 1} di ${files.length}: ${f.name}`;
    bar.style.width = (i / files.length * 100) + '%';
    try {
      const ex = await exifOfFile(f);
      const img = await fileToImg(f);
      const foto = imgToJpeg(img, 1400, .74), thumb = imgToJpeg(img, 160, .7, true);
      const l = nuovaScheda({ lat: ex.lat, lon: ex.lon, acc: ex.acc, alt: ex.alt, dir: ex.dir, fotoData: ex.date || null, file: f.name, thumb });
      if (hasPos(l)) conGps++;
      await DB.putLoculo(l, foto); S.loculi.push(l);
    } catch (e) { err++; }
    await new Promise(r => setTimeout(r, 0));
  }
  bar.style.width = '100%';
  await toccaCimitero();
  const ok = files.length - err;
  toast(`${ok} foto importate, ${conGps} con coordinate${err ? `, ${err} non leggibili` : ''}.`, 4500);
  if (ok && conGps < ok) S.filtro = 'nogps';
  rRilievo();
}

/* ---------------------------------------------------------------- Pacchetto */
async function pacchetto(cid) {
  const c = await DB.cimitero(cid), lo = await DB.loculi(cid);
  const out = [];
  for (const l of lo) out.push({ ...l, foto: await DB.foto(l.id) });
  return { formato: 'trova-loculo', versioneFormato: 1, app: APP_VERSION, esportato: new Date().toISOString(), cimitero: c, loculi: out };
}
async function esporta() {
  toast('Preparo il pacchetto…');
  const p = await pacchetto(S.cim.id);
  const name = S.cim.id + '.json';
  const blob = new Blob([JSON.stringify(p)], { type: 'application/json' });
  const file = typeof File !== 'undefined' ? new File([blob], name, { type: 'application/json' }) : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: S.cim.nome }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  toast(`Pacchetto ${name} salvato (${fmt(blob.size / 1048576, 1)} MB).`, 4000);
}
async function importaPacchetto(p, fonte) {
  if (!p || p.formato !== 'trova-loculo' || !p.cimitero || !Array.isArray(p.loculi)) throw new Error('Il file non è un pacchetto di Trova Loculo.');
  const c = { ...p.cimitero, fonte: fonte || p.cimitero.fonte || null, scaricato: new Date().toISOString() };
  if (!/^[a-z0-9-]{1,40}$/.test(c.id || '')) c.id = slug(c.nome);
  const old = await DB.loculi(c.id);
  const ids = new Set(p.loculi.map(l => l.id));
  for (const l of old) if (!ids.has(l.id)) await DB.delLoculo(l.id);
  for (const raw of p.loculi) {
    const { foto, ...l } = raw; l.cid = c.id;
    await DB.putLoculo(l, foto || null);
  }
  await DB.putCimitero(c);
  return c;
}
async function scaricaCimitero(id) {
  const r = await fetch('cimiteri/' + encodeURIComponent(id) + '.json', { cache: 'no-cache' });
  if (!r.ok) throw new Error('Cimitero «' + id + '» non trovato sul sito.');
  return importaPacchetto(await r.json(), 'cimiteri/' + id + '.json');
}

/* ---------------------------------------------------------------- QR */
function baseUrl() {
  const saved = ls.get('tl.base', '');
  if (saved) return saved;
  if (/^https?:$/.test(location.protocol) && !/claude\.ai|claudeusercontent|anthropic/.test(location.host)) return location.origin + location.pathname.replace(/index\.html$/, '');
  return '';
}
function qrUrl() { const b = baseUrl(); return b ? b.replace(/\?.*$/, '') + '?c=' + encodeURIComponent(S.cim.id) : ''; }
function rQR() {
  if (!S.cim) { back(); return; }
  view().innerHTML = `
    <div class="stack"><p class="eyebrow">Cartello per l’ingresso</p><h1>QR di ${esc(S.cim.nome)}</h1>
      <p class="muted small">Chi lo inquadra apre l’app, scarica il cimitero e può cercare il defunto. Stampa il cartello e plastificalo.</p></div>
    <label class="f">Indirizzo dell’app pubblicata<input id="base" type="url" value="${esc(baseUrl())}" placeholder="https://tuonome.github.io/trova-loculo/"></label>
    <p class="coord" id="qrurl"></p>
    <div class="qrwrap"><canvas id="qrc" width="1240" height="1754" aria-label="Cartello con QR"></canvas></div>
    <button class="btn primary block" id="btnSaveQr">${ICON.down}Salva il cartello (PNG)</button>`;
  const inp = $('#base');
  const draw = async () => {
    const url = qrUrl();
    $('#qrurl').textContent = url || 'Inserisci l’indirizzo in cui hai pubblicato l’app.';
    await disegnaCartello($('#qrc'), url);
  };
  inp.oninput = () => { ls.set('tl.base', inp.value.trim()); draw(); };
  $('#btnSaveQr').onclick = () => {
    if (!qrUrl()) { toast('Prima inserisci l’indirizzo dell’app.'); return; }
    $('#qrc').toBlob(b => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'QR-' + S.cim.id + '.png';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      toast('Cartello salvato.');
    }, 'image/png');
  };
  draw();
}
async function disegnaCartello(cv, url) {
  try { await document.fonts.load('700 60px Cinzel'); await document.fonts.load('700 40px "Atkinson Hyperlegible"'); } catch (e) { }
  const x = cv.getContext('2d'), W = cv.width, H = cv.height;
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#2E4A3C'; x.fillRect(0, 0, W, 230);
  x.fillStyle = '#F4F2EA'; x.textAlign = 'center';
  x.font = '700 64px Cinzel, Georgia, serif'; x.fillText('TROVA LOCULO', W / 2, 140);
  x.fillStyle = '#1E2225'; x.font = '700 62px Cinzel, Georgia, serif';
  wrapText(x, S.cim.nome.toUpperCase(), W / 2, 340, W - 160, 72);
  x.font = '40px "Atkinson Hyperlegible", sans-serif'; x.fillStyle = '#5A6166';
  if (S.cim.comune) x.fillText(S.cim.comune, W / 2, 470);
  const size = 820, ox = (W - size) / 2, oy = 540;
  if (url && typeof qrcode === 'function') {
    const q = qrcode(0, 'M'); q.addData(url); q.make();
    const n = q.getModuleCount(), cell = Math.floor(size / (n + 2)), off = (size - cell * n) / 2;
    x.fillStyle = '#000';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) x.fillRect(ox + off + c * cell, oy + off + r * cell, cell, cell);
  } else {
    x.strokeStyle = '#CFCFC7'; x.lineWidth = 4; x.setLineDash([16, 12]); x.strokeRect(ox, oy, size, size); x.setLineDash([]);
    x.fillStyle = '#5A6166'; x.font = '36px "Atkinson Hyperlegible", sans-serif'; x.fillText('Manca l’indirizzo dell’app', W / 2, oy + size / 2);
  }
  x.fillStyle = '#1E2225'; x.font = '700 50px "Atkinson Hyperlegible", sans-serif';
  x.fillText('Inquadra con la fotocamera', W / 2, 1460);
  x.font = '40px "Atkinson Hyperlegible", sans-serif'; x.fillStyle = '#5A6166';
  x.fillText('scrivi il cognome e segui la freccia', W / 2, 1525);
  x.fillStyle = '#80602F'; x.fillRect(W / 2 - 60, 1590, 120, 6);
}
function wrapText(x, text, cx, y, maxW, lh) {
  const words = text.split(' '); let line = '', yy = y;
  for (const w of words) { const t = line ? line + ' ' + w : w; if (x.measureText(t).width > maxW && line) { x.fillText(line, cx, yy); line = w; yy += lh; } else line = t; }
  x.fillText(line, cx, yy);
}

/* ---------------------------------------------------------------- Lettore QR interno */
function rScan() {
  view().innerHTML = `
    <div class="stack"><p class="eyebrow">QR del cimitero</p><h1>Inquadra il cartello</h1></div>
    <video class="scan" id="vid" playsinline muted hidden></video>
    <p class="muted" id="scanmsg">Avvio la fotocamera…</p>
    <div class="panel"><b>In alternativa</b><p class="muted small">Apri la normale fotocamera del telefono e inquadra il QR: si aprirà questa app con il cimitero già pronto.</p></div>`;
  const msg = $('#scanmsg');
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices?.getUserMedia) { msg.textContent = 'Il lettore interno non è supportato da questo browser. Usa la fotocamera del telefono.'; return; }
  let stream = null, alive = true, det = null;
  try { det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { msg.textContent = 'Lettore QR non disponibile. Usa la fotocamera del telefono.'; return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(s => {
    if (!alive) { s.getTracks().forEach(t => t.stop()); return; }
    stream = s; const v = $('#vid'); v.srcObject = s; v.hidden = false; v.play(); msg.textContent = 'Tieni il QR dentro l’inquadratura.';
    const loop = async () => {
      if (!alive) return;
      try {
        const r = await det.detect(v);
        if (r.length) { alive = false; stop(); return apriDaQR(r[0].rawValue); }
      } catch (e) { }
      setTimeout(loop, 300);
    };
    loop();
  }).catch(() => { msg.textContent = 'Fotocamera non consentita. Usa la fotocamera del telefono per inquadrare il QR.'; });
  const stop = () => { stream && stream.getTracks().forEach(t => t.stop()); };
  cleanup.push(() => { alive = false; stop(); });
}
async function apriDaQR(text) {
  let id = null;
  try { const u = new URL(text, location.href); id = u.searchParams.get('c'); if (id && u.origin !== location.origin) { location.href = u.href; return; } } catch (e) { }
  if (!id || !/^[a-z0-9-]{1,40}$/.test(id)) { toast('Questo QR non è di un cimitero Trova Loculo.', 4000); go('cimiteri'); return; }
  await apriCimitero(id);
}
async function apriCimitero(id) {
  try { toast('Scarico il cimitero…'); const c = await scaricaCimitero(id); await loadCimitero(c.id); toast(`${c.nome}: pronto anche senza internet.`, 3500); }
  catch (e) {
    if (await DB.cimitero(id)) { await loadCimitero(id); toast('Senza rete: uso la copia già salvata.', 3500); }
    else toast(e.message + ' Controlla la connessione.', 4500);
  }
  S.q = ''; go('cerca');
}

/* ---------------------------------------------------------------- Esempio */
async function creaDemo() {
  const id = 'esempio';
  toast('Preparo il cimitero di esempio…', 4000);
  await DB.delCimitero(id).catch(() => { });
  try { await document.fonts.load('700 40px Cinzel'); } catch (e) { }
  const c = { id, nome: 'Cimitero di esempio', comune: 'Dati di prova', creato: new Date().toISOString(), versione: new Date().toISOString(), esempio: true };
  await DB.putCimitero(c);
  const COG = ['Ferraro', 'Gallo', 'Bruno', 'Marino', 'Rizzo', 'Costa', 'Fontana', 'Caruso', 'Leone', 'Longo', 'Mancuso', 'Vitale', 'Barbieri', 'Sorrentino', 'Martino'];
  const NOM = ['Antonio', 'Maria', 'Giuseppe', 'Rosa', 'Francesco', 'Carmela', 'Domenico', 'Teresa', 'Vincenzo', 'Angela', 'Salvatore', 'Concetta', 'Pasquale', 'Filomena'];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const lat0 = 40.0, lon0 = 16.0, mLat = 1 / 111195, mLon = 1 / (111195 * Math.cos(rad(lat0)));
  const blocchi = [{ b: 'A', x: -20, y: 18, dx: 1.3, dy: 0 }, { b: 'B', x: 22, y: -4, dx: 0, dy: 1.3 }, { b: 'C', x: -18, y: -24, dx: 1.3, dy: 0 }];
  for (const bl of blocchi) for (let n = 1; n <= 6; n++) for (let f = 1; f <= 3; f++) {
    const cog = COG[Math.floor(rnd() * COG.length)], nom = NOM[Math.floor(rnd() * NOM.length)];
    const m = 1960 + Math.floor(rnd() * 64), na = m - 55 - Math.floor(rnd() * 40);
    const ex = (rnd() - .5) * 2.5, ey = (rnd() - .5) * 2.5;
    const img = lapideFinta(cog, nom, na, m);
    const l = nuovaScheda({
      cid: id, lat: lat0 + (bl.y + bl.dy * n * 1.0 + ey) * mLat, lon: lon0 + (bl.x + bl.dx * n * 1.0 + ex) * mLon, acc: Math.round(3 + rnd() * 5),
      thumb: imgToJpeg(img, 160, .7, true)
    });
    Object.assign(l, { cid: id, cognome: cog, nome: nom, nascita: String(na), morte: String(m), blocco: bl.b, fila: String(f), numero: String((n - 1) * 3 + f) });
    await DB.putLoculo(l, imgToJpeg(img, 900, .8));
  }
  await loadCimitero(id); S.q = 'rizzo'; go('cerca');
  toast('Esempio pronto: prova a cercare un cognome.');
}
function lapideFinta(cog, nom, na, m) {
  const c = document.createElement('canvas'); c.width = 600; c.height = 800; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 600, 800); g.addColorStop(0, '#E9E7E1'); g.addColorStop(1, '#C9C6BE'); x.fillStyle = g; x.fillRect(0, 0, 600, 800);
  x.strokeStyle = 'rgba(90,90,90,.18)'; x.lineWidth = 2;
  for (let i = 0; i < 9; i++) { x.beginPath(); x.moveTo(0, 90 * i + 20); x.bezierCurveTo(200, 90 * i - 30, 380, 90 * i + 90, 600, 90 * i + 30); x.stroke(); }
  x.strokeStyle = '#8A6A3B'; x.lineWidth = 6; x.strokeRect(30, 30, 540, 740);
  x.fillStyle = '#B9B5AC'; x.beginPath(); x.ellipse(300, 230, 95, 120, 0, 0, 7); x.fill();
  x.strokeStyle = '#8A6A3B'; x.lineWidth = 5; x.stroke();
  x.fillStyle = '#7A5B2E'; x.textAlign = 'center';
  x.font = '700 50px Cinzel, Georgia, serif'; x.fillText(cog.toUpperCase(), 300, 450);
  x.font = '700 40px Cinzel, Georgia, serif'; x.fillText(nom.toUpperCase(), 300, 510);
  x.font = '500 34px Cinzel, Georgia, serif'; x.fillText(na + ' – ' + m, 300, 590);
  x.font = '500 22px Cinzel, Georgia, serif'; x.fillText('ESEMPIO', 300, 700);
  return c;
}
